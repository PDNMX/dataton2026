<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datatón Anticorrupción 2026 — Próximamente</title>
  <meta name="description" content="Algo grande se aproxima. Datatón Anticorrupción 2026. Próximamente.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       PALETA NEÓN — Identidad del logo Datatón 2026
       ============================================================ */
    :root {
      --bg-dark: #050A14;
      --bg-surface: #0A1525;
      --primary: #00D4FF;
      --primary-light: #33E0FF;
      --primary-deep: #0099CC;
      --accent-pink: #E91E8C;
      --accent-pink-light: #FF4DA6;
      --accent-violet: #7B2FBE;
      --accent-navy: #0B1D3A;
      --accent-ice: #B8E8FF;
      --text: #ECF2F8;
      --text-muted: #7A9AB8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ---- MAIN CANVAS ---- */
    .canvas {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%, rgba(0, 212, 255, 0.06), transparent),
        radial-gradient(ellipse 60% 50% at 70% 60%, rgba(233, 30, 140, 0.04), transparent),
        radial-gradient(ellipse 50% 40% at 30% 35%, rgba(123, 47, 190, 0.03), transparent),
        linear-gradient(160deg, #030810 0%, #081428 35%, #0A1A35 60%, #0D1230 100%);
    }

    /* ---- GRID PATTERN ---- */
    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 70%);
      pointer-events: none;
    }

    /* ---- NETWORK CANVAS ---- */
    .network-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ---- CONTENT ---- */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 900px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    /* Logo Datatón 2026 */
    .hero-logo {
      display: block;
      width: min(85vw, 62vh * 1.094, 540px);
      height: auto;
      margin: 0 auto 1.75rem;
      padding: 0.6rem;
      background: #fff;
      border-radius: 28px;
      border: 1px solid rgba(0, 212, 255, 0.25);
      box-shadow: 0 0 60px rgba(0, 212, 255, 0.25), 0 0 120px rgba(233, 30, 140, 0.15);
      opacity: 0;
      animation: fadeInDown 0.8s ease 0.1s forwards;
    }

    /* Tag line */
    .tagline {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeInDown 0.8s ease 0.2s forwards;
    }
    .tagline .line {
      width: 30px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary));
    }
    .tagline .line:last-child {
      background: linear-gradient(90deg, var(--primary), transparent);
    }

    /* Title */
    .title {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeInUp 0.9s ease 0.4s forwards;
    }
    .title .word-dataton {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent-ice) 40%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .title .word-anti {
      background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-pink-light) 50%, var(--accent-violet) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Year */
    .year {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(3.5rem, 9vw, 7rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent-violet) 50%, var(--accent-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeInUp 0.9s ease 0.55s forwards;
    }

    /* Divider neon line */
    .neon-line {
      width: 100px;
      height: 2px;
      margin: 0 auto 2rem;
      background: linear-gradient(90deg, transparent, var(--primary), var(--accent-pink), transparent);
      border-radius: 2px;
      opacity: 0;
      animation: fadeIn 1s ease 0.7s forwards;
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 550px;
      margin: 0 auto 2.5rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.8s forwards;
    }
    .subtitle strong {
      color: var(--text);
      font-weight: 700;
    }

    /* Badge "Próximamente" */
    .badge-soon {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.6rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 60px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.95s forwards;
      position: relative;
      overflow: hidden;
    }
    .badge-soon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.05), rgba(233, 30, 140, 0.05));
      pointer-events: none;
    }
    .badge-soon .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--primary); }
      50%      { opacity: 0.4; box-shadow: 0 0 2px var(--primary); }
    }

    /* ---- FOOTER / LOGOS STRIP ---- */
    .logos-strip {
      position: relative;
      z-index: 10;
      background: rgba(5, 10, 20, 0.6);
      border-top: 1px solid rgba(0, 212, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeIn 1s ease 1.2s forwards;
    }
    .logos-strip .separator {
      width: 1px;
      height: 32px;
      background: rgba(0, 212, 255, 0.12);
    }
    .logos-strip img {
      height: 40px;
      width: auto;
      object-fit: contain;
      filter: brightness(0) invert(1) opacity(0.6);
      transition: filter 0.3s ease;
    }
    .logos-strip img:hover {
      filter: brightness(0) invert(1) opacity(0.9);
    }

    /* ---- ANIMATIONS ---- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(25px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 768px) {
      .content { padding: 1.5rem; }
      .logos-strip { gap: 1.5rem; padding: 1rem 1.5rem; }
      .logos-strip img { height: 30px; }
      .logos-strip .separator { height: 24px; }
      .ring--1 { width: 300px; height: 300px; }
      .ring--2 { width: 400px; height: 400px; }
      .ring--3 { width: 500px; height: 500px; }
    }

    @media (max-width: 480px) {
      .tagline { font-size: 0.7rem; letter-spacing: 0.15em; }
      .logos-strip { gap: 1rem; }
      .logos-strip img { height: 24px; }
    }
  </style>
</head>
<body>

  <main class="canvas">
    <!-- Animated network mesh -->
    <canvas class="network-canvas" id="networkCanvas"></canvas>

    <!-- Main content -->
    <div class="content">
      <img class="hero-logo" src="../img/logos/logo-dataton-2026.svg" alt="Logotipo Datatón Anticorrupción 2026, 8ª edición">

      <!-- Texto oculto por ahora (el logo ya lo incluye); el h1 se conserva para SEO/accesibilidad
      <div class="tagline">
        <span class="line"></span>
        8ª Edición
        <span class="line"></span>
      </div>

      <h1 class="title">
        <span class="word-dataton">Datatón</span><br>
        <span class="word-anti">Anticorrupción</span>
      </h1>
      <div class="year">2026</div>
      -->
      <h1 class="sr-only">Datatón Anticorrupción 2026</h1>

      <div class="neon-line"></div>

      <div class="badge-soon">
        <span class="pulse-dot"></span>
        Próximamente
      </div>
    </div>
  </main>

  <!-- Logos footer strip -->
  <footer class="logos-strip">
    <a href="https://www.sna.org.mx/" target="_blank" rel="noopener">
      <img src="../img/logos/logo-sna.svg" alt="Sistema Nacional Anticorrupción">
    </a>
    <span class="separator"></span>
    <a href="https://sesna.gob.mx" target="_blank" rel="noopener">
      <img src="../img/logos/logo-sesna.svg" alt="SESNA">
    </a>
    <span class="separator"></span>
    <a href="https://www.plataformadigitalnacional.org/" target="_blank" rel="noopener">
      <img src="../img/logos/logo-pdn2.svg" alt="Plataforma Digital Nacional">
    </a>
  </footer>

  <!-- Network mesh animation -->
  <script>
    (() => {
      const canvas = document.getElementById('networkCanvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const PARTICLE_COUNT = 55;
      const CONNECTION_DIST = 150;
      const MOUSE_DIST = 200;

      // Colors from the logo palette
      const colors = [
        { r: 0,   g: 212, b: 255 },  // cyan
        { r: 233, g: 30,  b: 140 },  // magenta
        { r: 123, g: 47,  b: 190 },  // violet
        { r: 0,   g: 184, b: 230 },  // cyan medium
        { r: 184, g: 232, b: 255 },  // ice
      ];

      let mouse = { x: -999, y: -999 };

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.vx = (Math.random() - 0.5) * 0.4;
          this.vy = (Math.random() - 0.5) * 0.4;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.radius = Math.random() * 2 + 1;
          this.baseAlpha = Math.random() * 0.4 + 0.2;
          this.alpha = this.baseAlpha;
          this.pulseSpeed = Math.random() * 0.02 + 0.005;
          this.pulseOffset = Math.random() * Math.PI * 2;
        }
        update(t) {
          this.x += this.vx;
          this.y += this.vy;

          // Soft boundary wrap
          if (this.x < -20) this.x = w + 20;
          if (this.x > w + 20) this.x = -20;
          if (this.y < -20) this.y = h + 20;
          if (this.y > h + 20) this.y = -20;

          // Pulse
          this.alpha = this.baseAlpha + Math.sin(t * this.pulseSpeed + this.pulseOffset) * 0.15;

          // Mouse attraction (subtle)
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MOUSE_DIST && dist > 0) {
            const force = (MOUSE_DIST - dist) / MOUSE_DIST * 0.008;
            this.vx += dx / dist * force;
            this.vy += dy / dist * force;
          }

          // Dampen velocity
          this.vx *= 0.999;
          this.vy *= 0.999;
        }
        draw() {
          const { r, g, b } = this.color;
          // Glow
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.alpha * 0.15})`;
          ctx.fill();
          // Core
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.alpha})`;
          ctx.fill();
        }
      }

      let particles = [];

      function init() {
        w = canvas.width = canvas.offsetWidth;
        h = canvas.height = canvas.offsetHeight;
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }

      function drawConnections() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECTION_DIST) {
              const opacity = (1 - dist / CONNECTION_DIST) * 0.15;
              const ci = particles[i].color;
              const cj = particles[j].color;
              const r = Math.round((ci.r + cj.r) / 2);
              const g = Math.round((ci.g + cj.g) / 2);
              const b = Math.round((ci.b + cj.b) / 2);
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${opacity})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
      }

      let frame = 0;
      function animate() {
        frame++;
        ctx.clearRect(0, 0, w, h);
        drawConnections();
        for (const p of particles) {
          p.update(frame);
          p.draw();
        }
        requestAnimationFrame(animate);
      }

      // Events
      window.addEventListener('resize', () => {
        w = canvas.width = canvas.offsetWidth;
        h = canvas.height = canvas.offsetHeight;
      });
      document.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });
      document.addEventListener('mouseleave', () => {
        mouse.x = -999;
        mouse.y = -999;
      });

      init();
      animate();
    })();
  </script>

</body>
</html>
